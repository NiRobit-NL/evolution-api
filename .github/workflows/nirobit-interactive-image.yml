name: Build NiroBit Evolution image

on:
  push:
    branches:
      - nirobit-2.3.7-interactive
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Preserve current production image for rollback
        shell: bash
        run: |
          rollback="ghcr.io/nirobit-nl/evolution-api:2.3.7-interactive-rollback-20260808"
          current="ghcr.io/nirobit-nl/evolution-api:2.3.7-interactive"
          if ! docker buildx imagetools inspect "$rollback" >/dev/null 2>&1; then
            docker buildx imagetools create --tag "$rollback" "$current"
          fi

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: |
            ghcr.io/nirobit-nl/evolution-api:2.3.7-interactive
            ghcr.io/nirobit-nl/evolution-api:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
