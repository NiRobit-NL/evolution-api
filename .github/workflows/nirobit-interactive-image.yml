name: Build NiroBit Evolution image

on:
  push:
    branches:
      - nirobit-2.3.7-interactive
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ghcr.io/nirobit-nl/evolution-api:2.3.7-interactive
          cache-from: type=gha
          cache-to: type=gha,mode=max
